# Publishes a GitHub release when a version tag (v0.4.19, ...) is pushed:
#   AgenticClient.exe                 Windows, one self-contained file (it writes its www files out on the first start)
#   AgenticDesktop-<version>-x64.msi  Windows installer (per user, Start menu and desktop shortcuts; tools\MsiBuilder)
#   agentic-desktop-<version>-linux-x64.tar.gz   Linux (the Agentic-Desktop folder)
#   SHA256SUMS.txt
# Windows builds run on Windows, so the exe keeps its icon and version resource. The notes are the annotated tag's message.
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

env:
  # The MSI's upgrade code: never change it, or new MSIs stop replacing installed ones (same as tools\publish-clients.ps1).
  UPGRADE_CODE: '{5B0E4C1A-6D2F-4E8B-9A71-3C4D2E1F0A93}'

jobs:
  build:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        id: version
        shell: bash
        run: |
          project=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' AgenticClient.vbproj | head -n 1)
          if [ "$project" != "${GITHUB_REF_NAME#v}" ]; then echo "Tag $GITHUB_REF_NAME does not match <Version> $project"; exit 1; fi
          echo "version=$project" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: bash
        run: |
          dotnet publish AgenticClient.vbproj -c Release -r ${{ matrix.rid }} -o Agentic-Desktop -nologo
          rm -f Agentic-Desktop/*.pdb Agentic-Desktop/config.json
          cp LICENSE README.md Agentic-Desktop/
          ls -la Agentic-Desktop

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force dist, msi-source | Out-Null
          Copy-Item Agentic-Desktop/AgenticClient.exe dist/AgenticClient.exe
          (Get-Item dist/AgenticClient.exe).VersionInfo | Format-List ProductName, ProductVersion, FileVersion
          # The installer holds the exe and its www folder.
          Copy-Item Agentic-Desktop/AgenticClient.exe msi-source/
          Copy-Item Agentic-Desktop/www msi-source/ -Recurse
          dotnet build tools/MsiBuilder/MsiBuilder.vbproj -c Release -nologo -o msibuilder
          if ($LASTEXITCODE -ne 0) { throw 'MsiBuilder did not build.' }
          ./msibuilder/MsiBuilder.exe --source msi-source --exe AgenticClient.exe --name 'Agentic Desktop' --manufacturer Agentic `
            --version $v --upgrade-code $env:UPGRADE_CODE --arch x64 --out "dist/AgenticDesktop-$v-x64.msi"
          if ($LASTEXITCODE -ne 0) { throw 'The MSI was not built.' }
          Get-ChildItem dist

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x Agentic-Desktop/AgenticClient
          mkdir -p dist
          tar -czf "dist/agentic-desktop-${{ steps.version.outputs.version }}-linux-x64.tar.gz" Agentic-Desktop

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          gh release create "$GITHUB_REF_NAME" dist/* --title "Agentic Desktop ${GITHUB_REF_NAME#v}" --notes-from-tag --verify-tag
