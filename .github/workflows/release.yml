# Publishes a GitHub release when a version tag (v0.4.19, ...) is pushed: the app for Windows (WinForms + WebView2, built
# on Windows) and for Linux, each as an Agentic-Desktop folder with the program and its www files, plus SHA-256 sums.
# The notes are the annotated tag's message.
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        id: version
        shell: bash
        run: |
          project=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' AgenticClient.vbproj | head -n 1)
          if [ "$project" != "${GITHUB_REF_NAME#v}" ]; then echo "Tag $GITHUB_REF_NAME does not match <Version> $project"; exit 1; fi
          echo "version=$project" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: bash
        run: |
          dotnet publish AgenticClient.vbproj -c Release -r ${{ matrix.rid }} -o Agentic-Desktop -nologo
          rm -f Agentic-Desktop/*.pdb Agentic-Desktop/config.json
          cp LICENSE README.md Agentic-Desktop/
          ls -la Agentic-Desktop

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path Agentic-Desktop -DestinationPath "agentic-desktop-${{ steps.version.outputs.version }}-win-x64.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x Agentic-Desktop/AgenticClient
          tar -czf "agentic-desktop-${{ steps.version.outputs.version }}-linux-x64.tar.gz" Agentic-Desktop

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: agentic-desktop-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          gh release create "$GITHUB_REF_NAME" dist/* --title "Agentic Desktop ${GITHUB_REF_NAME#v}" --notes-from-tag --verify-tag
